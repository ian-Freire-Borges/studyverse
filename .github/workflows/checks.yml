name: Studyverse checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:bomb
      - run: npm run typecheck:bomb
      - run: npm run test:bomb
      - run: npm run test:bomb:network
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bomb:e2e
        env:
          BOMB_ARTIFACT_DIR: ${{ runner.temp }}/bomb-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bomb-arena-screenshots
          path: ${{ runner.temp }}/bomb-artifacts
          if-no-files-found: ignore
